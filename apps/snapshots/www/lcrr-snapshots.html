<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshots · LiveCues ReaperRemote</title>
<link rel="icon" href="lcrr/shared/img/icon.svg" type="image/svg+xml">
<link rel="icon" href="lcrr/shared/img/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="lcrr/shared/img/apple-touch-icon.png">
<link rel="stylesheet" href="lcrr/shared/css/tokens.css">
<link rel="stylesheet" href="lcrr/shared/css/base.css">
<link rel="stylesheet" href="lcrr/snapshots/css/snapshots.css">
</head>
<body data-state="connecting">
<header class="snapshots-bar">
  <div class="snapshots-bar-inner">
    <h1 id="snapshots-heading" class="snapshots-title"></h1>
    <span id="snapshots-project-name" class="snapshots-project-name"></span>
    <span id="snapshots-state" role="status" aria-live="polite" aria-atomic="true" data-state="connecting"><i class="snapshots-shape" aria-hidden="true"></i><span id="snapshots-state-text"></span></span>
  </div>
  <div id="snapshots-banner" role="alert" hidden></div>
  <p id="snapshots-message" class="snapshots-message" role="alert" hidden></p>
  <p id="snapshots-note" class="snapshots-note" role="status" hidden></p>
</header>

<main>
  <!-- Everything that acts on the project lives in here; it stays hidden while the bridge is not running. -->
  <div id="snapshots-controls" hidden>
    <fieldset class="snapshots-ticks-box">
      <legend id="snapshots-ticks-legend" class="snapshots-label"></legend>
      <div id="snapshots-ticks" class="snapshots-ticks"></div>
      <p id="snapshots-ticks-note" class="snapshots-hint"></p>
    </fieldset>
    <form id="snapshots-form" class="snapshots-form" autocomplete="off">
      <label class="snapshots-field">
        <span id="snapshots-name-label" class="snapshots-label"></span>
        <input id="snapshots-name" type="text" spellcheck="false">
      </label>
      <button id="snapshots-save" class="snapshots-key snapshots-primary" type="submit"></button>
    </form>
    <p id="snapshots-empty" class="snapshots-hint" hidden></p>
    <p id="snapshots-hold-hint" class="snapshots-hint" hidden></p>
    <ul id="snapshots-list" class="snapshots-list"></ul>
  </div>
</main>

<footer class="lcrr-footer">
  <div class="lcrr-footer-inner">
    <a class="lcrr-home" href="lcrr.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Home</a>
  </div>
</footer>

<script src="lcrr/shared/js/version.js"></script>
<script src="lcrr/shared/js/reaper.js"></script>
<script src="lcrr/shared/js/poll.js"></script>
<script src="lcrr/shared/js/guard.js"></script>
<script src="lcrr/shared/js/hold.js"></script>
<script src="lcrr/shared/js/bridge-wire.js"></script>
<script src="lcrr/shared/js/bridge-client.js"></script>
<script src="lcrr/snapshots/js/wire.js"></script>
<script src="lcrr/snapshots/js/restore.js"></script>
<script src="lcrr/snapshots/js/client.js"></script>
<script src="lcrr/snapshots/js/core.js"></script>
<script src="lcrr/snapshots/js/words.js"></script>
<script src="lcrr/snapshots/js/hold-key.js"></script>
<script src="lcrr/snapshots/js/restore-ui.js"></script>
<script src="lcrr/snapshots/js/snapshots.js"></script>
</body>
</html>
