<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrange · LiveCues ReaperRemote</title>
<link rel="icon" href="lcrr/shared/img/icon.svg" type="image/svg+xml">
<link rel="icon" href="lcrr/shared/img/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="lcrr/shared/img/apple-touch-icon.png">
<link rel="stylesheet" href="lcrr/shared/css/tokens.css">
<link rel="stylesheet" href="lcrr/shared/css/base.css">
<link rel="stylesheet" href="lcrr/arrange/css/arrange.css">
</head>
<body data-state="connecting">
<header class="arrange-bar">
  <div class="arrange-bar-inner">
    <h1 class="arrange-title">Arrange</h1>
    <span id="arrange-state" role="status" aria-live="polite" aria-atomic="true" data-state="connecting"><i class="arrange-shape" aria-hidden="true"></i><span id="arrange-state-text">Connecting&hellip;</span></span>
  </div>
  <div id="arrange-banner" role="alert" hidden></div>
  <div id="arrange-busy" role="status" aria-live="polite" hidden></div>
</header>

<main>
  <div id="arrange-project" class="arrange-project" hidden>
    <span class="arrange-label">Project</span>
    <strong id="arrange-project-name"></strong>
    <span id="arrange-project-path" class="arrange-path"></span>
    <button type="button" id="arrange-refresh" class="arrange-quiet" disabled>Refresh</button>
  </div>

  <div id="arrange-work" class="is-locked">
    <section class="arrange-section" aria-labelledby="arrange-h-arrangement">
      <h2 id="arrange-h-arrangement" class="arrange-h">Arrangement</h2>
      <label class="arrange-field">
        <span class="arrange-label">Name</span>
        <select id="arrange-name" disabled></select>
      </label>
      <p id="arrange-sidecar" class="arrange-note" hidden></p>
    </section>

    <div class="arrange-tabs" role="tablist" aria-label="Run or edit">
      <button type="button" role="tab" id="arrange-tab-run" class="arrange-tab" aria-selected="true" aria-controls="arrange-panel-run">Run</button>
      <button type="button" role="tab" id="arrange-tab-edit" class="arrange-tab" aria-selected="false" aria-controls="arrange-panel-edit" tabindex="-1">Edit</button>
    </div>

    <div id="arrange-panel-run" role="tabpanel" aria-labelledby="arrange-tab-run">
      <section class="arrange-section">
        <div class="arrange-buttons">
          <button type="button" id="arrange-check" disabled>Check</button>
          <button type="button" id="arrange-verify" disabled>Verify</button>
        </div>
      </section>

      <section id="arrange-result" class="arrange-result" aria-live="polite"></section>

      <section class="arrange-section" aria-labelledby="arrange-h-capture">
        <h2 id="arrange-h-capture" class="arrange-h">Capture an Arrangement</h2>
        <label class="arrange-field">
          <span class="arrange-label">Save the current region order as</span>
          <input id="arrange-capture-name" type="text" value="Captured" autocomplete="off" disabled>
        </label>
        <div class="arrange-buttons"><button type="button" id="arrange-capture" disabled>Capture</button></div>
      </section>

      <section class="arrange-section" aria-labelledby="arrange-h-diagnostics">
        <h2 id="arrange-h-diagnostics" class="arrange-h">Diagnostics</h2>
        <div class="arrange-buttons">
          <button type="button" id="arrange-dup" disabled>Duplicate and unnamed regions</button>
          <button type="button" id="arrange-timebase" disabled>Track timebase</button>
          <button type="button" id="arrange-bars" disabled>Bar lines and Padding</button>
        </div>
      </section>
    </div>

    <div id="arrange-panel-edit" role="tabpanel" aria-labelledby="arrange-tab-edit" hidden>
      <section class="arrange-section">
        <div class="arrange-buttons">
          <button type="button" id="arrange-new" disabled>New</button>
          <button type="button" id="arrange-duplicate" disabled>Duplicate</button>
          <button type="button" id="arrange-rename" disabled>Rename</button>
          <button type="button" id="arrange-delete" disabled>Delete</button>
          <button type="button" id="arrange-undo" disabled>Undo</button>
        </div>
        <div id="arrange-edit-prompt" class="arrange-prompt" hidden></div>
        <p id="arrange-undo-note" class="arrange-hint" role="status" hidden></p>
        <p id="arrange-edit-note" class="arrange-note" hidden></p>
        <p id="arrange-edit-msg" class="arrange-note is-problem" role="alert" hidden></p>
      </section>

      <section id="arrange-editor" class="arrange-section" hidden>
        <h3 class="arrange-group-title" id="arrange-h-in">In this Arrangement</h3>
        <p id="arrange-empty-note" class="arrange-hint" hidden></p>
        <ol id="arrange-in" class="arrange-rows" aria-labelledby="arrange-h-in"></ol>
        <h3 class="arrange-group-title" id="arrange-h-out">Left out, will be parked</h3>
        <ul id="arrange-out" class="arrange-rows" aria-labelledby="arrange-h-out"></ul>
        <div class="arrange-buttons arrange-edit-foot">
          <button type="button" id="arrange-edit-check" class="arrange-primary" disabled>Check this Arrangement</button>
        </div>
      </section>
    </div>
  </div>

</main>

<footer class="lcrr-footer">
  <div class="lcrr-footer-inner">
    <a class="lcrr-home" href="lcrr.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Home</a>
  </div>
</footer>

<script src="lcrr/shared/js/reaper.js"></script>
<script src="lcrr/shared/js/poll.js"></script>
<script src="lcrr/shared/js/guard.js"></script>
<script src="lcrr/arrange/js/wire.js"></script>
<script src="lcrr/arrange/js/client.js"></script>
<script src="lcrr/arrange/js/words.js"></script>
<script src="lcrr/arrange/js/editor.js"></script>
<script src="lcrr/arrange/js/arrange.js"></script>
</body>
</html>
