<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEM Setup · LiveCues ReaperRemote</title>
<link rel="icon" href="lcrr/shared/img/icon.svg" type="image/svg+xml">
<link rel="icon" href="lcrr/shared/img/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="lcrr/shared/img/apple-touch-icon.png">
<link rel="stylesheet" href="lcrr/shared/css/tokens.css">
<link rel="stylesheet" href="lcrr/shared/css/base.css">
<link rel="stylesheet" href="lcrr/iem/css/iem.css">
</head>
<body data-state="connecting">
<header class="iem-bar">
  <div class="iem-bar-inner">
    <h1 class="iem-title">IEM Setup</h1>
    <span id="iem-project-name" class="iem-project-name"></span>
    <span id="iem-state" role="status" aria-live="polite" aria-atomic="true" data-state="connecting"><i class="iem-shape" aria-hidden="true"></i><span id="iem-state-text">Connecting&hellip;</span></span>
    <a class="lcrr-sibling" href="lcrr-iemmix.html" title="Balance all mixes">IEM Mix<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 4.5v15L19 12z"/></svg></a>
  </div>
  <div id="iem-banner" role="alert" hidden></div>
  <p id="iem-message" class="iem-message" role="alert" hidden></p>
</header>

<main>
  <!-- The strip above the grid: the filter, the tag legend and one disclosure key per setup job. A panel opens on demand; an empty project opens Mixes by itself. -->
  <div id="iem-setup" class="iem-setup" hidden>
    <input id="iem-filter" class="iem-filter" type="text" placeholder="Filter tracks" aria-label="Filter tracks" autocomplete="off" spellcheck="false" disabled>
    <p id="iem-legend" class="iem-legend" hidden></p>
    <div class="iem-toggles">
      <button id="iem-tog-mixes" class="iem-toggle" type="button" aria-expanded="false" aria-controls="iem-panel-mixes"><span class="iem-toggle-name">Add mix</span><span class="iem-toggle-status" id="iem-status-mixes"></span></button>
      <button id="iem-tog-outputs" class="iem-toggle" type="button" aria-pressed="false" hidden><span class="iem-toggle-name">Outputs</span><span class="iem-toggle-status" id="iem-status-outputs"></span></button>
      <button id="iem-tog-folder" class="iem-toggle" type="button" aria-expanded="false" aria-controls="iem-panel-folder"><span class="iem-toggle-name">Folder</span><span class="iem-toggle-status" id="iem-status-folder"></span></button>
      <button id="iem-tog-cue" class="iem-toggle" type="button" aria-expanded="false" aria-controls="iem-panel-cue"><span class="iem-toggle-name">Cue</span><span class="iem-toggle-status" id="iem-status-cue"></span></button>
    </div>
  </div>

  <!-- Every label is set from words.js. One panel open at a time, one job each. -->
  <div id="iem-panels" class="iem-panels">
    <section class="iem-panel" id="iem-panel-mixes" role="region" aria-labelledby="iem-tog-mixes" hidden>
      <form id="iem-create" class="iem-create" autocomplete="off">
        <label class="iem-field">
          <span class="iem-label" id="iem-create-label"></span>
          <input id="iem-create-name" type="text" spellcheck="false">
        </label>
        <label class="iem-field">
          <span class="iem-label" id="iem-create-copy-label"></span>
          <select id="iem-create-copy"></select>
        </label>
        <button id="iem-create-go" class="iem-primary" type="submit"></button>
      </form>
    </section>
    <section class="iem-panel" id="iem-panel-folder" role="region" aria-labelledby="iem-tog-folder" hidden>
      <div class="iem-panel-row">
        <label class="iem-field iem-colour" id="iem-colour-box">
          <span class="iem-label" id="iem-colour-label"></span>
          <input id="iem-colour" type="color">
        </label>
        <button id="iem-move" type="button"></button>
      </div>
      <p id="iem-folder-note" class="iem-note"></p>
    </section>
    <section class="iem-panel" id="iem-panel-cue" role="region" aria-labelledby="iem-tog-cue" hidden>
      <div class="iem-panel-row">
        <button id="iem-cue" type="button" hidden></button>
        <label class="iem-field iem-cue-out" id="iem-cue-out-box" hidden>
          <span class="iem-label" id="iem-cue-out-label"></span>
          <select id="iem-cue-out"></select>
        </label>
      </div>
      <p id="iem-cue-note" class="iem-note"></p>
    </section>
  </div>

  <p id="iem-empty" class="iem-notice" hidden></p>

  <div id="iem-scroll" class="iem-scroll" tabindex="0" role="region" aria-label="Which tracks feed which mix" hidden>
    <table id="iem-grid" class="iem-grid">
      <thead id="iem-head"></thead>
      <tbody id="iem-body"></tbody>
    </table>
  </div>
</main>

<footer class="lcrr-footer">
  <div class="lcrr-footer-inner">
    <a class="lcrr-home" href="lcrr.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Home</a>
  </div>
</footer>

<script src="lcrr/shared/js/version.js"></script>
<script src="lcrr/shared/js/reaper.js"></script>
<script src="lcrr/shared/js/poll.js"></script>
<script src="lcrr/shared/js/guard.js"></script>
<script src="lcrr/shared/js/hold.js"></script>
<script src="lcrr/shared/js/bridge-wire.js"></script>
<script src="lcrr/shared/js/bridge-client.js"></script>
<script src="lcrr/iem/js/wire.js"></script>
<script src="lcrr/iem/js/client.js"></script>
<script src="lcrr/iem/js/core.js"></script>
<script src="lcrr/iem/js/words.js"></script>
<script src="lcrr/iem/js/iem.js"></script>
</body>
</html>
