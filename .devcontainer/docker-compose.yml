services:
  dev:
    container_name: lcrr-devcontainer
    # VS Code builds this only when the Dockerfile changes (layer cache otherwise).
    build:
      context: .
    image: lcrr-devcontainer:latest
    tty: true
    # Do NOT publish 8080 here: it is REAPER's web interface port on the Windows host,
    # and a Docker port mapping hijacks http://localhost:8080 (ERR_EMPTY_RESPONSE).
    # For smoke tests, run `npm run serve` (or `python3 -m http.server 8081`) and use
    # VS Code port forwarding.
    volumes:
      - ..:/workspace
      - claude:/home/vscode/.claude

volumes:
  claude:
