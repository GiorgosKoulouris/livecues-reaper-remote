name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Same toolchain as .devcontainer/Dockerfile. REAPER embeds Lua 5.4; lua-busted makes 5.1 the default `lua`.
      - name: Install the Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 lua-busted lua-check
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
      - run: npm test
      - run: npm run check
